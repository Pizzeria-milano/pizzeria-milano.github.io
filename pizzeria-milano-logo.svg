<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fraunces:wght@400;900&amp;family=Unbounded:wght@600&amp;display=swap');
    .tfr { font-family: 'Fraunces', 'Times New Roman', serif; font-weight: 900; font-variation-settings: 'opsz' 144; }
    .tub { font-family: 'Unbounded', 'Arial', sans-serif; font-weight: 600; }
    .tfi { font-family: 'Fraunces', 'Times New Roman', serif; font-style: italic; font-weight: 400; }
  </style>
  <defs>
    <radialGradient id="feuer-grad" cx="50%" cy="70%" r="80%">
      <stop offset="0%"  stop-color="#e8b860"/>
      <stop offset="50%" stop-color="#b51a2b"/>
      <stop offset="100%" stop-color="#0e0805"/>
    </radialGradient>
  </defs>

  <!-- OFEN -->
  <g transform="translate(130, 165)">
    <rect x="-72" y="40" width="144" height="10" fill="#4a0912"/>
    <rect x="-80" y="50" width="160" height="6"  fill="#7a0f1c"/>
    <rect x="-60" y="0" width="120" height="40" fill="#4a0912"/>
    <path d="M -60 0 Q -60 -60 0 -60 Q 60 -60 60 0 Z" fill="#4a0912"/>
    <g stroke="#2a050a" stroke-width="1" fill="none" opacity=".5">
      <path d="M -50 -8 Q -50 -48 0 -48 Q 50 -48 50 -8"/>
      <path d="M -40 -20 Q -40 -40 0 -40 Q 40 -40 40 -20"/>
      <line x1="-30" y1="0" x2="-30" y2="-38"/>
      <line x1="0"   y1="0" x2="0"   y2="-50"/>
      <line x1="30"  y1="0" x2="30"  y2="-38"/>
      <line x1="-15" y1="-8" x2="-15" y2="-46"/>
      <line x1="15"  y1="-8" x2="15"  y2="-46"/>
    </g>
    <path d="M -28 40 Q -28 -5 0 -5 Q 28 -5 28 40 Z" fill="#0e0805"/>
    <path d="M -26 40 Q -26 -3 0 -3 Q 26 -3 26 40 Z" fill="url(#feuer-grad)"/>
    <g transform="translate(0, 25)">
      <path d="M 0 0 C -14 -8 -16 -26 -8 -40 C -3 -32 2 -30 4 -40 C 14 -26 18 -10 4 0 Z" fill="#e8b860"/>
      <path d="M 0 -4 C -8 -10 -9 -24 -4 -32 C -1 -26 2 -24 3 -30 C 9 -22 11 -12 1 -4 Z" fill="#f4ead7"/>
    </g>
    <g transform="translate(0, 40)" fill="#6b4423">
      <rect x="-18" y="-4" width="10" height="4" rx="1"/>
      <rect x="-5"  y="-4" width="10" height="4" rx="1"/>
      <rect x="8"   y="-4" width="10" height="4" rx="1"/>
    </g>
    <g fill="#6b5a4a" opacity=".25">
      <circle cx="-4" cy="-78" r="4"/>
      <circle cx="6"  cy="-88" r="5"/>
      <circle cx="-2" cy="-100" r="3"/>
    </g>
  </g>

  <!-- TRENNER -->
  <line x1="250" y1="100" x2="250" y2="240" stroke="#c89b3c" stroke-width="1" opacity=".6"/>

  <!-- TEXT -->
  <g transform="translate(285, 0)">
    <text x="0" y="118" class="tub" font-size="13" fill="#b51a2b" letter-spacing="6">— PIZZERIA —</text>
    <text x="0" y="190" class="tfr" font-size="80" fill="#4a0912" letter-spacing="-2">Milano</text>
    <text x="0" y="226" class="tfi" font-size="15" fill="#6b5a4a" letter-spacing="0.5">— forno a legna · MMXXV —</text>
  </g>
</svg>
